<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mima's pick ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(180deg,#ffd9e7,#fff0f6 55%,#ffd7e7);color:#6f354b}
.wrap{max-width:760px;margin:auto;padding:28px 16px 44px;text-align:center}
h1{font-family:Georgia,serif;font-size:clamp(34px,9vw,58px);margin:12px 0 4px;color:#a33c64}
.sub{margin:0 0 24px;font-size:15px;letter-spacing:.04em;color:#9a5a72}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.card{background:#fff8fb;border:3px solid #e8a5bd;border-radius:22px;padding:8px;
box-shadow:0 9px 24px rgba(143,55,91,.13);cursor:pointer;transition:.15s}
.card:active{transform:scale(.98)}
.card img{width:100%;height:46vh;max-height:470px;min-height:300px;object-fit:cover;border-radius:15px;display:block}
.pick{padding:10px 4px 6px;font-weight:700;color:#a33c64}
.vs{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:22px;margin:13px 0;color:#bd6b89}
.progress{margin:18px auto 0;font-size:13px;color:#a56a80}
.winner{display:none;background:#fff8fb;border:3px solid #e8a5bd;border-radius:25px;padding:10px;
box-shadow:0 10px 28px rgba(143,55,91,.15);max-width:440px;margin:0 auto}
.winner img{width:100%;max-height:62vh;object-fit:cover;border-radius:17px;display:block}
.winner h2{font-family:Georgia,serif;font-size:31px;color:#a33c64;margin:15px 0 8px}
button{border:0;border-radius:999px;background:#a33c64;color:white;padding:12px 22px;font-weight:700;font-size:15px;margin:8px 0 4px}
@media(max-width:520px){.wrap{padding-top:18px} .arena{gap:9px} .card{padding:6px;border-width:2px} .card img{height:43vh;min-height:260px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Hello mima ❤️</h1>
<p class="sub">Choose the one you love most</p>
<div id="game">
  <div class="arena">
    <div class="card" id="left" onclick="choose(0)"><img><div class="pick">Choose this</div></div>
    <div class="card" id="right" onclick="choose(1)"><img><div class="pick">Choose this</div></div>
  </div>
  <div class="vs">this or this?</div>
  <div class="progress" id="progress"></div>
</div>
<div class="winner" id="winner"><img><h2>Your winner 🏆</h2><button onclick="start()">Play again</button></div>
</div>

let queue=[], champion=null, challenger=null, round=0;
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
 queue=shuffled(originals); champion=queue.shift(); challenger=queue.shift(); round=1;
 document.getElementById('winner').style.display='none';document.getElementById('game').style.display='block';render();
}
function render(){
 document.querySelector('#left img').src=champion.src;
 document.querySelector('#right img').src=challenger.src;
 document.getElementById('progress').textContent=`Pick ${round} of ${originals.length-1}`;
}
function choose(side){
 champion = side===0 ? champion : challenger;
 if(queue.length){challenger=queue.shift();round++;render();}
 else{
  document.getElementById('game').style.display='none';
  const w=document.getElementById('winner');w.querySelector('img').src=champion.src;w.style.display='block';
 }
}
start();
</script>
